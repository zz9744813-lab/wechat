<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  max-width: 677px;
  margin: 0 auto;
  padding: 20px;
  color: #333;
  font-size: 16px;
  line-height: 1.75;
  background: #fff;
}
h1 {
  font-size: 22px;
  font-weight: bold;
  color: #1a1a1a;
  margin-bottom: 16px;
  line-height: 1.4;
}
h2 {
  font-size: 18px;
  font-weight: bold;
  color: #1a1a1a;
  margin: 24px 0 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid #07c160;
}
h3 {
  font-size: 16px;
  font-weight: bold;
  color: #333;
  margin: 20px 0 8px;
}
p {
  margin: 12px 0;
  text-align: justify;
}
blockquote {
  border-left: 4px solid #07c160;
  margin: 16px 0;
  padding: 12px 16px;
  background: #f8f8f8;
  color: #666;
  font-size: 15px;
}
blockquote p { margin: 4px 0; }
strong { color: #07c160; }
em { color: #576b95; font-style: normal; }
ul, ol { padding-left: 24px; margin: 12px 0; }
li { margin: 6px 0; }
code {
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 14px;
  color: #e74c3c;
}
pre {
  background: #2d2d2d;
  color: #f8f8f2;
  padding: 16px;
  border-radius: 8px;
  overflow-x: auto;
  font-size: 14px;
  line-height: 1.5;
}
pre code {
  background: none;
  color: inherit;
  padding: 0;
}
img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  margin: 16px 0;
}
hr {
  border: none;
  border-top: 1px solid #e5e5e5;
  margin: 24px 0;
}
.author-info {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid #e5e5e5;
}
.highlight-box {
  background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
  border-radius: 8px;
  padding: 16px 20px;
  margin: 16px 0;
  border-left: 4px solid #07c160;
}
</style>
</head>
<body>
  <h1>{{ title }}</h1>
  <div class="author-info">{% if author %}作者：{{ author }}{% endif %}</div>
  <hr>
  {{ content_html }}
  {% if author %}
  <div class="author-info">
    <p>— {{ author }} —</p>
  </div>
  {% endif %}
</body>
</html>
