<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  max-width: 677px;
  margin: 0 auto;
  padding: 20px;
  color: #333;
  font-size: 16px;
  line-height: 1.75;
  background: #fff;
}
h1 {
  font-size: 24px;
  font-weight: bold;
  color: #c0392b;
  margin-bottom: 16px;
  line-height: 1.4;
  text-align: center;
}
h2 {
  font-size: 18px;
  font-weight: bold;
  color: #2c3e50;
  margin: 28px 0 12px;
  padding-left: 12px;
  border-left: 4px solid #c0392b;
}
h3 {
  font-size: 16px;
  font-weight: bold;
  color: #e74c3c;
  margin: 20px 0 8px;
}
p {
  margin: 12px 0;
  text-align: justify;
}
blockquote {
  border-left: 4px solid #e74c3c;
  margin: 16px 0;
  padding: 12px 16px;
  background: #fdf2f2;
  color: #555;
}
blockquote p { margin: 4px 0; }
strong { color: #c0392b; }
ul, ol { padding-left: 24px; margin: 12px 0; }
li { margin: 6px 0; }
img {
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  margin: 16px 0;
}
hr {
  border: none;
  border-top: 2px solid #c0392b;
  margin: 24px 0;
}
.author-info {
  text-align: center;
  color: #888;
  font-size: 13px;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid #e5e5e5;
}
.key-point {
  background: #fdf2f2;
  border-radius: 8px;
  padding: 16px 20px;
  margin: 16px 0;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  color: #c0392b;
}
</style>
</head>
<body>
  <h1>{{ title }}</h1>
  <div class="author-info">{% if author %}作者：{{ author }}{% endif %}</div>
  <hr>
  {{ content_html }}
  {% if author %}
  <div class="author-info">
    <p>— {{ author }} —</p>
  </div>
  {% endif %}
</body>
</html>
